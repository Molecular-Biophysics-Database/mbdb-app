[project]
name = "mbdb-app"
version = "1.0.0"
description = "something"
packages = []
authors = []
dependencies = [
    "oarepo[s3,rdm]>=14.0.0,<15.0.0",
    "oarepo-app[production]>=7.0.0,<8.0.0",
    #"oarepo-model",
    "billiard==4.2.4",
    "oarepo-model>=6.0.0,<7.0.0",
    "oarepo-runtime>=7.0.0,<8.0.0",
    "oarepo-rdm>=9.0.0,<10.0.0",
]
requires-python = ">=3.14,<3.15"

[project.entry-points."invenio_assets.webpack"]
i18n = "i18n.webpack:theme"
components = "ui.components.webpack:theme"
ui_mst = "ui.mst.webpack:theme"
ui_spr = "ui.spr.webpack:theme"
ui_itc = "ui.itc.webpack:theme"
ui_bli = "ui.bli.webpack:theme"
ui_mp = "ui.mp.webpack:theme"
ui_playground = "ui.playground.webpack:theme"

[project.entry-points."invenio_i18n.translations"]
translations = "i18n"

[project.entry-points."invenio_db.alembic"]
repository = "common:alembic"

[project.entry-points."invenio_base.blueprints"]
ui_mst = "ui.mst:create_blueprint"
ui_spr = "ui.spr:create_blueprint"
ui_itc = "ui.itc:create_blueprint"
ui_bli = "ui.bli:create_blueprint"
ui_mp = "ui.mp:create_blueprint"
ui_playground = "ui.playground:create_blueprint"

[project.entry-points."invenio_base.api_blueprints"]
ror = "common.ror:create_blueprint"

[project.entry-points."invenio_base.finalize_app"]
ui_mst = "ui.mst:finalize_app"
ui_spr = "ui.spr:finalize_app"
ui_itc = "ui.itc:finalize_app"
ui_bli = "ui.bli:finalize_app"
ui_mp = "ui.mp:finalize_app"

[tool.uv.build-backend]
module-root = ""
module-name = [
    "common",
    "i18n",
    "ui",
    "models",
]

[tool.uv]
# oarepo-app[production] pins oarepo-rdm==8.6.1 and oarepo-model==5.4.x;
# the GitHub main branch of oarepo-rdm is 9.x and the project needs oarepo-model 6.x,
# so both pins are overridden.
override-dependencies = [
    "oarepo-rdm>=9.0.0,<10.0.0",
    "oarepo-model>=6.0.0,<7.0.0",
    "oarepo-runtime>=7.0.0,<8.0.0",
]

[build-system]
requires = [
    "uv_build>=0.8.7,<0.9.0",
]
build-backend = "uv_build"
