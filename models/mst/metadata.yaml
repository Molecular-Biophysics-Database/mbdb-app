# Definition of metadata for mst. Please do not add ccmm model here,
# add the ccmm_preset instead.
Metadata:
  properties:
    general_parameters:
      help.en: The general parameter of the experiment
      required: true
      label.en: General parameters
      type: General_parameters
    method_specific_parameters:
      help.en: The parameters of the experiment that are specific to
        MST/TRIC/Spectral Shift
      required: true
      label.en: Method specific parameters
      type: MST_specific_parameters
