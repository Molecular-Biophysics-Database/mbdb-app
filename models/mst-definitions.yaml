MST_specific_parameters:
  properties:
    schema_version:
      type: keyword
      enum:
        - 0.9.12
      help.en: The schema version used to annotate the MST method specific 
        parameters
      required: true
      label.en: Schema version
    experiment_type:
      type: keyword
      enum:
        - Affinity
        - Concentration
        - Other
      help.en: The type of physical parameter that was sought
      required: true
      label.en: Experiment type
    signal_type:
      type: keyword
      enum:
        - Initial intensity
        - TRIC/MST
        - Spectral shift
      help.en: The type of signal that was being measured
      required: true
      label.en: Signal type
    excitation_led_color:
      type: keyword
      enum:
        - RED (ex 605-645nm, em 660-720nm)
        - RED (ex 610-645nm, em 680-720nm)
        - GREEN (ex 555-585nm, em 605-690nm)
        - GREEN (ex 515-550nm, em 565-600nm)
        - BLUE (ex 480-500nm, em 515-550nm)
        - BLUE (ex 460-500nm, em 515-560nm)
        - UV (ex 260-300nm, em 330-380nm)
        - Spectral shift
      help.en: The color of the excitation LED used for the experiment. NOTE 
        that colors are specific to the combination in which it occurs, e.g. the
        GREEN in a BLUE/GREEN instrument, is not the same as the GREEN in a 
        GREEN/RED instrument
      required: true
      label.en: Excitation led color
    excitation_led_power:
      type: double
      minimum: 0.0
      maximum: 100.0
      help.en: The power, in percentage, of the excitation LED used in 
        experiment
      required: true
      label.en: Excitation led power
    ir_mst_laser_power:
      type: double
      minimum: 0.0
      maximum: 100.0
      help.en: The power of the infrared LASER used in the experiment in 
        percentages. Even though a change in nomenclature occurred in 
        Nanotemper's control software, the underlying data is still stored in 
        percentages. Use the following conversion; Low = 20, Medium = 40, High =
        60
      required: true
      label.en: Ir mst laser power
    temperature:
      help.en: The temperature of the sample chamber while the measurement was 
        performed
      label.en: Temperature
      type: Temperature
    measurements:
      minItems: 1
      help.en: List of the information about each measurement. This includes 
        target(s), ligand(s), chemical environment, and the position of the 
        sample within the instrument
      required: true
      label.en: Measurements
      items:
        type: Measurement
      type: array
    data_analysis:
      minItems: 1
      help.en: The details of how data analysis was performed to obtain results
      label.en: Data analysis
      items:
        type: MST_data_analysis
      type: array
  label.en: Mst specific parameters
  marshmallow:
    base-classes: [common.services.records.schema.VersionUpdateSchema]
MST_data_analysis:
  properties:
    results:
      minItems: 1
      help.en: Link to the result(s) that was obtained by the data analysis. The
        link is to the results defined in the record
      label.en: Results
      items:
        type: internal-relation
        target: metadata.general_parameters.results
        keys:
          - id
          - name
      type: array
    measurements:
      minItems: 1
      help.en: List of the measurements that were analyzed together for a 
        specific parameter
      label.en: Measurements
      items:
        type: internal-relation
        target: metadata.method_specific_parameters.measurements
        keys:
          - id
          - name
      type: array
    f_cold_and_hot:
      help.en: If the data was analyzed with time windows corresponding to 
        fluorescence before and after an IR laser was heating the sample the 
        edges of the time windows can be specified here
      label.en: F cold and hot
      type: F_cold_and_hot
    data_processing:
      minItems: 1
      help.en: Describe the steps in the data analysis prior to fitting 
        (removing outliers in the raw data, applying smoothing filters, etc.)
      label.en: Data processing
      items:
        type: Processing_step
      type: array
    data_fitting:
      help.en: The details of how data fitting was performed to obtain the 
        result
      label.en: Data fitting
      type: Data_fitting
  label.en: Mst data analysis
F_cold_and_hot:
  properties:
    time_unit:
      help.en: The unit of time used for reporting measurement data
      required: true
      label.en: Time unit
      type: TIME_UNITS
    f_cold_start:
      type: double
      minimum: -100.0
      help.en: Numerical value of the start-point of time interval used to 
        establish the initial fluorescence, F_cold
      required: true
      label.en: F cold start
    f_cold_end:
      type: double
      minimum: -100.0
      help.en: Numerical value of the end-point of time interval used to 
        establish the initial fluorescence, F_cold
      required: true
      label.en: F cold end
    f_hot_start:
      type: double
      minimum: 0.0
      help.en: Numerical value of the start-point of time interval used to 
        establish the fluorescence temperature induced change in fluorescence, 
        F_hot
      required: true
      label.en: F hot start
    f_hot_end:
      type: double
      minimum: 0.0
      help.en: Numerical value of the end-point of time interval used to 
        establish the fluorescence temperature induced change in fluorescence, 
        F_hot
      required: true
      label.en: F hot end
  label.en: F cold and hot
Measurement:
  properties:
    id:
      help.en: Unique ID to be used as a link target
      required: true
      label.en: Id
      type: keyword
    name:
      type: keyword
      help.en: Name (id) of the measurement which must be unique within a record
        (i.e. triplicates must be named individually in the raw data file). The 
        name must allow location of the measurement data within the raw data 
        file as well as processed data files if these are present
      required: true
      label.en: Name
    position:
      type: keyword
      help.en: Position where the container (capillary) of the measured sample 
        within the instrument (e.g. 1, 2, 3)
      required: true
      label.en: Position
    sample:
      help.en: Information about the sample including concentrations of ligands 
        and targets, and which chemical environment the sample was composed of
      required: true
      label.en: Sample
      type: Sample
  id: mst-measurement
  label.en: Measurement
Sample:
  properties:
    targets:
      minItems: 1
      help.en: List of names (ids), from the entities of interest defined in the
        record, of directly measured entities
      required: true
      label.en: Targets
      items:
        type: Entity_constituent
      type: array
    ligands:
      minItems: 1
      help.en: List of names (ids) of entities (from the entities of interest 
        defined in the record) that were used to alter the behavior of the 
        target(s)
      required: true
      label.en: Ligands
      items:
        type: Entity_constituent
      type: array
    chemical_environment:
      help.en: Name (id) of the chemical environment of the sample (from the 
        chemical environments defined in the record)
      required: true
      label.en: Chemical environment
      type: internal-relation
      target: metadata.general_parameters.chemical_environments
      keys:
        - id
        - name
    measurement_container:
      type: keyword
      enum:
        - Monolith Standard Capillary
        - Monolith Premium Capillary
        - Monolith LabelFree Capillary
        - Monolith LabelFree Premium Capillary
        - Monolith NT.Automated Capillary Chip
        - Monolith NT.Automated Premium Capillary Chip
        - Monolith NT.Automated LabelFree Capillary Chip
        - Monolith NT.Automated LabelFree Premium Capillary Chip
        - 384-well plate
        - other
      help.en: The container the sample was in during the measurement
      required: true
      label.en: Measurement container
    preparation_protocol:
      minItems: 1
      help.en: List of steps taken to prepare the sample, ending at the point 
        where it was placed in the measurement container. Information include 
        operations like filtration and which filter material and pore-size was 
        used should be added
      label.en: Preparation protocol
      items:
        type: Step
      type: array
  label.en: Sample
Entity_constituent:
  properties:
    entity:
      help.en: Name (id) of the entity (from the entities of interest defined in
        the record)
      required: true
      label.en: Entity
      type: internal-relation
      target: metadata.general_parameters.entities_of_interest
      keys:
        - id
        - name
    concentration:
      help.en: Concentration of the entity
      required: true
      label.en: Concentration
      type: Concentration
  label.en: Entity constituent
Data_fitting:
  properties:
    model:
      type: keyword
      help.en: Description of the model (e.g. 1:1 binding)
      required: true
      label.en: Model
    software_name:
      type: keyword
      help.en: The name of the software that was used for doing the data fitting
        (e.g. Excel)
      label.en: Software name
    software_version:
      type: keyword
      help.en: The version of the software that was used for the step
      label.en: Software version
    quality:
      type: double
      help.en: Numerical value representing the quality estimate of the result
      label.en: Quality
    quality_type:
      type: keyword
      enum:
        - R^2
        - SEM
        - red. Chi^2
        - 1sigma
        - 2sigma
        - 3sigma
        - 5sigma
        - Skewness
      help.en: Type of the quality estimate
      label.en: Quality type
  label.en: Data fitting
Processing_step:
  properties:
    name:
      type: keyword
      help.en: Short descriptive name of the processing step
      required: true
      label.en: Name
    description:
      type: keyword
      help.en: Description of what the processing step was
      required: true
      label.en: Description
    software_name:
      type: keyword
      help.en: The name of the software that was used for the step (e.g. Excel)
      label.en: Software name
    software_version:
      type: keyword
      help.en: The version of the software that was used for the step
      label.en: Software version
    link_to_source_code:
      type: keyword
      help.en: If processing was performed with software where the source code 
        is freely available a link can be specified here (e.g. self-written 
        python script in a GitHub repository)
      label.en: Link to source code
  label.en: Processing step
