properties:
  synthetic_fields:
    properties:
      people:
        type: keyword
        marshmallow:
          read: false
          write: false
        label.cs: Osoby
        label.en: People
      affiliations:
        type: keyword
        marshmallow:
          read: false
          write: false
        label.cs: Afiliace
        label.en: Affiliations

record:
  imports:
    - import: oarepo_runtime.records.systemfields.SyntheticSystemField
    - import: oarepo_runtime.records.systemfields.PathSelector
    - import: oarepo_runtime.records.systemfields.FilteredSelector
    - import: oarepo_runtime.records.systemfields.MultiSelector
    - import: oarepo_runtime.records.systemfields.FirstItemSelector
    - import: nr_metadata.records.synthetic_fields.KeywordsFieldSelector

  fields:
      people: |
        SyntheticSystemField(
            PathSelector("metadata.general_parameters.depositors.depositor", 
                          "metadata.general_parameters.depositors.principal_contact",
                          "metadata.general_parameters.depositors.contributors"),
            map=lambda x: ", ".join(p for p in [x.get("family_name"), x.get("given_name")] if p),
            key="synthetic_fields.people",
        )
      affiliations: |
        SyntheticSystemField(
            PathSelector("metadata.general_parameters.depositors.contributors.affiliations", 
                          "metadata.general_parameters.depositors.depositor.affiliations",
                          "metadata.general_parameters.depositors.principal_contact.affiliations"),
            map=lambda x: x.get('title', {}).get('en'),
            key="synthetic_fields.affiliations",
        )
