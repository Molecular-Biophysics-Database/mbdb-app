$defs:
  use: ["./general_parameters-definitions.yaml", "./spr-definitions.yaml"]

plugins:
  builder:
    disable:
    - script_sample_data
    - invenio_record_metadata_alembic_setup_cfg
  packages:
  - oarepo-model-builder-drafts-files
  - oarepo-model-builder-relations
  - oarepo-model-builder-files
  - oarepo-model-builder-requests
  - oarepo-model-builder-cf
  - oarepo-model-builder-drafts
  - oarepo-model-builder-ui
  - oarepo-model-builder-polymorphic
  - oarepo-model-builder-vocabularies
  - oarepo-model-builder-communities>=5.0.0
  - oarepo-model-builder-rdm
profiles:
- record
- draft
- files
- draft_files
record:
  use:
  - "invenio"
  - "rdm"
  - ./spr-facet-groups.yaml
  - ./synthetic-fields.yaml
  draft:
    use:
    - ./spr-facet-groups.yaml
  draft-files:
    resource:
      base-classes: [ oarepo_ui.resources.file_resource.S3RedirectFileResource ]
  files:
    use: ['./files.yaml', 'invenio_files']
    resource:
      base-classes: [ oarepo_ui.resources.file_resource.S3RedirectFileResource ]
  module:
    qualified: spr
  permissions:
    presets:
    - mbdb
  pid:
    type: spr
  properties:
    metadata:
      properties:
        use: ["./spr-metadata.yaml"]
  resource-config:
    base-url: /records/spr/
    base-html-url: /spr/
  facets:
    facet-names:
      metadata.general_parameters.record_information.license.name: License name
      metadata.method_specific_parameters.measurements.name: Measurement name
      metadata.method_specific_parameters.measurement_positions.name: Measurement position
      metadata.method_specific_parameters.measurement_protocol.name: Measurement protocol
      metadata.method_specific_parameters.measurement_protocol.type: Measurement protocol type
      metadata.method_specific_parameters.measurements.reference_samples.position: Reference sample position
      metadata.method_specific_parameters.measurements.samples.position: Sample position
      metadata.method_specific_parameters.sensor.supplier.catalog_number: Sensor catalog number
      metadata.method_specific_parameters.sensor.supplier.name: Sensor supplier name

runtime-dependencies: {}

settings:
  i18n-languages: [en]
  extension-elements: [ui_file_context]

use: ["./settings.yaml"]
