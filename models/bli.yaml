$defs:
  use: ["./general_parameters-definitions.yaml", "./bli-definitions.yaml"]

plugins:
  builder:
    disable:
    - script_sample_data
    - invenio_record_metadata_alembic_setup_cfg
  packages:
  - oarepo-model-builder-drafts-files
  - oarepo-model-builder-relations
  - oarepo-model-builder-files
  - oarepo-model-builder-requests
  - oarepo-model-builder-cf
  - oarepo-model-builder-drafts
  - oarepo-model-builder-ui
  - oarepo-model-builder-polymorphic
  - oarepo-model-builder-vocabularies
  - oarepo-model-builder-communities>=5.0.0
  - oarepo-model-builder-rdm
profiles:
- record
- draft
- files
- draft_files
record:
  use:
  - "invenio"
  - "rdm"
  - ./bli-facet-groups.yaml
  - ./synthetic-fields.yaml
  draft:
    use:
    - ./bli-facet-groups.yaml
  draft-files:
    resource:
      base-classes: [ oarepo_ui.resources.file_resource.S3RedirectFileResource ]
  files:
    use: ['./files.yaml', 'invenio_files']
    resource:
      base-classes: [ oarepo_ui.resources.file_resource.S3RedirectFileResource ]
  module:
    qualified: bli
  permissions:
    presets:
    - mbdb
  pid:
    type: bli
  properties:
    metadata:
      properties:
        use: ["./bli-metadata.yaml"]
  resource-config:
    base-url: /records/bli/
    base-html-url: /bli/
  facets:
    facet-names:
      metadata.method_specific_parameters.measurements.name: Measurement name
      metadata.general_parameters.record_information.license.name: License name
      metadata.method_specific_parameters.measurement_protocol.name: Protocol name
      metadata.method_specific_parameters.measurement_protocol.type: Protocol type
      metadata.method_specific_parameters.plates.name: Plate
      metadata.method_specific_parameters.plates.supplier.name: Plate supplier
      metadata.method_specific_parameters.plates.supplier.catalog_number: Plate catalog number
      metadata.method_specific_parameters.plates.type: Plate type
      metadata.method_specific_parameters.sensors.name: Sensor
      metadata.method_specific_parameters.sensors.supplier.catalog_number: Sensor catalog number
      metadata.method_specific_parameters.sensors.supplier.name: Sensor supplier

runtime-dependencies: {}

settings:
  i18n-languages: [en]
  extension-elements: [ui_file_context]

use: ["./settings.yaml"]
